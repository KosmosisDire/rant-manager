# Builds and tests the manager on every platform the rant CLI ships for, and packs the archive
# rant install unpacks. A run on main whose version has no tag yet also releases it, with the
# archives attached.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Whether this run releases: on main, when no tag v<version> exists yet
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null || found=$?
          # 2 is no such tag, anything else a lookup that went wrong
          test "$found" = 0 || test "$found" = 2
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$found" = 2 ]; then release=true; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Linux builds in the manylinux_2_28 container, as Rant's wheels do, so the manager runs on
  # any glibc since 2.28. No linux-arm64, since the CLI it drives ships no build for it.
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  platform: linux-x64, container: 'quay.io/pypa/manylinux_2_28_x86_64' }
          - { os: windows-latest, platform: win-x64 }
          - { os: macos-15,       platform: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # the end to end tests drive the newest released CLI, as users run it
      - name: The newest rant
        shell: bash
        run: |
          sh ci/cli.sh ${{ matrix.platform }}
          echo "RANT_CLI=$GITHUB_WORKSPACE/cli/rant${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Lint
        run: cargo clippy --locked --release --all-targets -- -D warnings

      - name: Test
        timeout-minutes: 10
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release --bins

      - name: Archive
        shell: bash
        run: sh ci/archive.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: rant-manager-${{ matrix.platform }}
          path: out/*

  # The Linux manager must start on the oldest and newest distributions people run.
  check-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rant-manager-linux-x64
          path: out

      - name: The archive holds the package
        run: |
          mkdir pkg
          tar -xzf out/manager-*-linux-x64.tar.gz -C pkg
          test -f pkg/package.rant && test -f pkg/Manager.run

      - name: It starts everywhere
        run: |
          for image in rockylinux:8 debian:10 ubuntu:20.04 ubuntu:22.04 ubuntu:24.04; do
            echo "== $image"
            docker run --rm -v "$PWD/pkg:/p" "$image" /p/bin/rant-manager --version
          done

  # The release makes the tag v<version> on this commit, once every check above passed
  release:
    needs: [plan, build, check-linux]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # a later commit's run that passed too finds the version taken and stops
      - name: The version is not released from another commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh prints the error body on a miss, so only a found tag is compared
          if at="$(gh api "repos/$GITHUB_REPOSITORY/commits/v${{ needs.plan.outputs.version }}" --jq .sha 2>/dev/null)"; then
            test "$at" = "$GITHUB_SHA"
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: rant-manager-*
          path: release
          merge-multiple: true

      - uses: actions/checkout@v7
        with:
          path: source

      # the package carries its skill folder, the files at the zip's top
      - name: Skill
        working-directory: source/skill
        run: zip -r "$GITHUB_WORKSPACE/release/manager-${{ needs.plan.outputs.version }}-skill.zip" .

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.plan.outputs.version, '-') }}
