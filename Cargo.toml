[package]
name = "rant-manager"
version = "0.0.2"
edition = "2024"
description = "Runs, stops and restarts a workspace's groups and nodes from the mesh"
publish = false

[[bin]]
name = "rant-manager"
path = "src/main.rs"

[dependencies]
rant-middleware = { git = "https://github.com/KosmosisDire/Rant.git", tag = "crate-v0.0.34" }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
